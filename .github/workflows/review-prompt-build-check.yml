name: Review prompt build check
on:
  push:
    branches: [review-prompt]
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: |
          ls /Applications | grep -i xcode || true
          sudo xcode-select -s /Applications/Xcode_26.6.app || true
          xcodebuild -version
      - name: List schemes
        run: xcodebuild -list -project AmberGlow.xcodeproj
      - name: Build (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild build -project AmberGlow.xcodeproj -scheme AmberGlow \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee build.log
      - name: Warnings in touched files
        if: always()
        run: |
          grep -E "(ReviewPrompter|DetailPane|AmberGlowApp)\.swift:[0-9]+:[0-9]+: warning" build.log | sort -u || echo "none"
