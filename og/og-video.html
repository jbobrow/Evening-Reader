<!DOCTYPE html>
<html lang="en">
<head>
<!-- Source for the site's share video (og:video): the share image, with the
     article scrolling at a reading pace under the fixed top bar, then back to
     the top. The reading-progress line and the scroll indicator, both baked into
     screen.webp, are redrawn so they move with the scroll. An 8-second loop that
     opens and closes on the share image. Open it in a browser to watch it loop;
     re-render the video with ./render-video.sh -->
<meta charset="utf-8">
<title>Evening Reader share video</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,700&family=Inter:wght@500;600&display=block">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: radial-gradient(ellipse 70% 80% at 30% 30%, rgba(235,143,71,.6), rgba(235,143,71,0) 70%), #cf7733;
    color: #190c02;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }
  .copy {
    position: absolute; left: 88px; top: 0; bottom: 0; width: 540px;
    display: flex; flex-direction: column; justify-content: center; gap: 26px;
  }
  .app { display: flex; align-items: center; gap: 22px; }
  .app img { width: 84px; height: 84px; border-radius: 19px; box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 6px 18px rgba(0,0,0,.10); }
  .app span { font-size: 40px; font-weight: 700; letter-spacing: -0.01em; }
  h1 {
    font-family: ui-serif, "New York", "Iowan Old Style", "Source Serif 4", Georgia, serif;
    font-size: 70px; font-weight: 700;
    line-height: 1.02; letter-spacing: -0.02em;
    text-wrap: balance;
  }
  .pitch { font-size: 25px; line-height: 1.38; color: #4a2406; font-weight: 500; max-width: 500px; }
  .note { font-size: 19px; font-weight: 600; color: #4a2406; opacity: .8; margin-top: -12px; }
  .sig { width: 214px; height: auto; color: #190c02; margin-top: 6px; }

  /* iPhone, cropped by the bottom edge like the NYC Parking preview */
  .phone {
    position: absolute; left: 690px; top: 52px; width: 418px; height: 900px;
    border-radius: 72px; padding: 14px;
    background: #2a1505;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.08), 0 0 0 1.5px rgba(0,0,0,.35), 0 30px 60px rgba(0,0,0,.18);
  }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 58px; overflow: hidden; background: #000; }
  .screen img { width: 100%; display: block; }
  .island { position: absolute; top: 14px; left: 50%; width: 118px; height: 34px; margin-left: -59px; border-radius: 17px; background: #000; }

  /* Mac: the two screens bleed off the right edge */
  .mac { position: absolute; left: 672px; top: 110px; width: 600px; }
  .macs { width: 100%; display: block; filter: drop-shadow(0 24px 40px rgba(0,0,0,.12)); }
  .cur { position: absolute; width: 34px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.25)); }
  .c1 { left: 150px; top: 190px; }
  .c2 { left: 420px; top: 120px; }

  /* The screen in layers, in screen.webp pixels scaled by 390/720:
     the top bar (rows 0-188) stays put; the article below it scrolls. */
  .screen > .body, .screen > .bar { position: absolute; left: 0; right: 0; overflow: hidden; }
  .screen > .body { top: 102.375px; bottom: 0; }
  .screen > .bar { top: 0; height: 102.375px; }
  .screen .layer { position: absolute; left: 0; width: 390px; }
  .screen .layer img { width: 390px; display: block; }
  .body .layer { top: -102.375px; }
  /* Paint out the baked scroll indicator (x 8-16, y 765-843) with the page color */
  .patch { position: absolute; left: 2.708px; top: 410.583px; width: 8.667px; height: 49.833px; background: rgb(212 126 53); }
  .indicator {
    position: absolute; left: 4.333px; top: 414.375px; width: 4.875px; height: 42.792px;
    border-radius: 3px; background: rgb(148 84 30);
  }
  .progress { position: absolute; left: 0; top: 99.125px; height: 2.167px; width: 209.625px; background: rgb(80 38 4); }
</style>
</head>
<body>
  <div class="copy">
    <div class="app"><img src="icon.png" alt=""><span>Evening Reader</span></div>
    <h1>Soft on the eyes, warmth for the soul.</h1>
    <p class="pitch">Save articles, books and PDFs, then read them on a warm amber page.</p>
    
    <!-- The same signature as the site footers and the other previews -->
    <svg class="sig" aria-label="App by Jon Bobrow" viewBox="0 0 3087.29 681.93" fill="none" stroke="currentColor" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"><path d="M1610.11,335.11c0,17.82,19.8,77.22,3.96,110.89M15,537.47C23.66,136.35,107.34,18.04,136.2,15.15c28.86-2.89,86.57,31.74,86.57,484.8M80.58,356.55c65.34-37.62,178.21-25.74,178.21-25.74M320.17,330.81c81.18-15.84,176.23,73.26,47.52,142.57M466.7,328.83c81.18-15.84,160.39,71.28,67.32,134.65M353.83,396.15c-5.94,104.95,29.7,241.57,29.7,241.57M490.46,378.33c-5.94,104.95,13.86,211.87,13.86,211.87M788.37,148.98c-11.88,49.5-26.16,130.64-33.66,199.99-7.92,73.26,38.68,123.77,86.2,90.1s12.8-101.98-40.66-98.06M923.02,537.08c-35.64,27.72-53.4,109.67,2.96,126.69,69.81,21.08,80.2-67.28,76.24-138.57s-19.8-194.05-19.8-194.05M982.42,331.15c1.98,75.24-9.9,118.81-51.48,110.89s-31.68-85.14-23.76-128.71M1388.34,55.92c29.7,142.57,55.95,373.41-47.52,407.9-71.28,23.76-100.98-51.48-93.06-83.16M1507.15,321.25c-45.54-3.96-56.51,138.61,9.9,138.61,73.26,0,47.85-133.59-9.9-138.61ZM2225.92,343.03c-72.62,9.68-56.39,142.67,9.9,138.61,97.02-5.94,49.5-146.53-9.9-138.61ZM2686.12,343.13c-64.18-8.02-87.35,95.19-26.56,112.77,66.28,19.16,73.26-106.93,26.56-112.77ZM1614.07,445.99c19.8-85.14,41.58-116.83,55.44-116.83s37.62,108.91,73.26,128.71M1934.85,172.74c47.52-45.54,186.13-25.74,194.05,33.66,7.92,59.4-39.6,97.02-37.62,122.77s56.36,69.3,38.54,120.79-66.26,57.42-137.55,25.74M2002.17,198.48c-5.94,47.52-1.98,209.89,7.92,241.57M2352.65,182.64c-7.92,55.44-9.84,280.18,67.32,277.21,51.48-1.98,57.42-116.83-17.82-122.77M2590.26,305.41c-35.64,13.86-59.4,27.56-59.4,134.65,0,9.9-15.84-93.06-19.8-116.83M2881.33,392.53s-9.9,67.32,39.6,65.34c69.28-2.77,130.89-59.33,148.51-138.61,15.84-71.28-39.6-83.16-39.6-83.16M2778.37,360.85c-7.92,49.5-1.85,92.77,17.82,95.04,51.48,5.94,85.14-63.36,85.14-63.36"/></svg>
  </div>
  <div class="phone"><div class="screen">
    <div class="body"><div class="layer" id="article"><img src="screen.webp" alt=""><div class="patch"></div></div></div>
    <div class="bar"><div class="layer"><img src="screen.webp" alt=""></div><div class="progress" id="progress"></div></div>
    <div class="indicator" id="indicator"></div>
    <div class="island"></div>
  </div></div>
  <script>
  // Scroll, in screen.webp pixels: three flicks down at reading pace, a pause,
  // then back to the top, as when you tap the status bar. 8-second loop.
  const T = 8, S = 390 / 720;
  const flicks = [[.8, 2.1, 0, 145], [2.7, 4.0, 145, 290], [4.6, 5.9, 290, 430], [6.5, 7.35, 430, 0]];
  const decel = (u) => 1 - Math.pow(1 - u, 3);                       // momentum after a flick
  const inOut = (u) => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
  // An article ~20 screens long: the indicator moves ~1/20 of the scroll, the
  // progress line ~1/40 (it spans 720px for the whole article)
  const article = document.getElementById('article'), bar = document.getElementById('progress'), ind = document.getElementById('indicator');
  window.seek = (time) => {
    const t = ((time % T) + T) % T;
    let d = 0;
    for (const [a, b, from, to] of flicks) {
      if (t >= b) d = to;
      else if (t > a) { const u = (t - a) / (b - a); d = from + (to - from) * (to < from ? inOut(u) : decel(u)); break; }
    }
    article.style.transform = `translateY(${(-d * S).toFixed(2)}px)`;
    ind.style.transform = `translateY(${(d * .05 * S).toFixed(2)}px)`;
    bar.style.width = `${((387 + d * .026) * S).toFixed(2)}px`;
  };
  seek(0);
  const t0 = performance.now();
  (function tick() { if (!window.__frozen) seek((performance.now() - t0) / 1000); requestAnimationFrame(tick); })();
  </script>
</body>
</html>
